# PPO config for the Stillwalker's movement policy (stalking and running away).
#   mlagents-learn Assets/Scripts/AI/Stillwalker/Training/stillwalker.yaml --run-id=stillwalker02
# then press Play in the training scene. The behaviour name must match the one on
# Behavior Parameters ("Stillwalker", set automatically by StillwalkerAgent).
#
# Models from stillwalker01 won't load any more (15 observations, now 51), so this is a
# fresh run, don't use --resume or --initialize-from on the old one.
behaviors:
  Stillwalker:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      # memory is what lets it learn a player's habits over time (about 6s of decisions).
      # It roughly doubles training time on CPU. Delete this block for a faster, dumber run.
      memory:
        memory_size: 128
        sequence_length: 64
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 6000000
    time_horizon: 128
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 10

# Read by StillwalkerAgent through Academy.EnvironmentParameters.
environment_parameters:
  # how good the hunter bot is: clumsy at first so it can learn the basics of escaping
  hunter_skill:
    curriculum:
      - name: Clumsy
        completion_criteria:
          measure: progress
          behavior: Stillwalker
          threshold: 0.15
        value: 0.25
      - name: Decent
        completion_criteria:
          measure: progress
          behavior: Stillwalker
          threshold: 0.45
        value: 0.6
      - name: Mixed
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.4
            max_value: 1.0

  # share of episodes played by the hunter bot instead of a recording
  hunter_chance: 0.5

  # share of episodes that start already cracked, lots early on so it learns to run
  hurt_start_chance:
    curriculum:
      - name: LotsOfRunning
        completion_criteria:
          measure: progress
          behavior: Stillwalker
          threshold: 0.3
        value: 0.6
      - name: Normal
        value: 0.35
