default_settings: null
behaviors:
  Stillwalker:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 128
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 10
    even_checkpoints: false
    max_steps: 6000000
    time_horizon: 128
    summary_freq: 20000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters:
  hunter_skill:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 3201
          value: 0.25
      name: Clumsy
      completion_criteria:
        behavior: Stillwalker
        measure: progress
        min_lesson_length: 0
        signal_smoothing: true
        threshold: 0.15
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 3202
          value: 0.6
      name: Decent
      completion_criteria:
        behavior: Stillwalker
        measure: progress
        min_lesson_length: 0
        signal_smoothing: true
        threshold: 0.45
        require_reset: false
    - value:
        sampler_type: uniform
        sampler_parameters:
          seed: 3203
          min_value: 0.4
          max_value: 1.0
      name: Mixed
      completion_criteria: null
  hunter_chance:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 3204
          value: 0.5
      name: hunter_chance
      completion_criteria: null
  hurt_start_chance:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 3205
          value: 0.6
      name: LotsOfRunning
      completion_criteria:
        behavior: Stillwalker
        measure: progress
        min_lesson_length: 0
        signal_smoothing: true
        threshold: 0.3
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 3206
          value: 0.35
      name: Normal
      completion_criteria: null
checkpoint_settings:
  run_id: stillwalker02
  initialize_from: null
  load_model: false
  resume: false
  force: true
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: null
debug: false
